name: split-packages

# main 푸시마다 패키지별 소비용 브랜치(pkg/react, pkg/tokens)를 재생성한다.
# yarn v1(careernote-web)은 git 의존의 하위 폴더를 못 읽으므로 subtree split 브랜치로 소비한다.
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  split:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Split & push package branches
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git subtree split --prefix=packages/react -b pkg/react
          git subtree split --prefix=packages/tokens -b pkg/tokens
          git push -f origin pkg/react pkg/tokens
