name: deploy-catalog

# main 푸시마다 카탈로그를 GitHub Pages 로 배포
# https://careernote.github.io/careernote-design-system/
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun run --cwd apps/catalog build
      - run: bun run --cwd apps/catalog-vue build
      - run: mkdir -p apps/catalog/dist-app/vue && cp -r apps/catalog-vue/dist-app/* apps/catalog/dist-app/vue/
      - run: mkdir -p apps/catalog/dist-app/guide && cp docs/guide.html apps/catalog/dist-app/guide/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/catalog/dist-app
      - id: deployment
        uses: actions/deploy-pages@v4
